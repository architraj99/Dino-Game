<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">

        <div class="top-bar">

            <h1>Dino Game</h1>

            <div class="score-box">
                Score: <span id="score">0</span>
            </div>

            <div class="speed-box">
                Speed: <span id="speedText">1x</span>
            </div>

        </div>

        <div class="game-area">

            <div class="cloud"></div>

            <div class="dino" id="dino">
                🦖
            </div>

            <div class="game-over" id="gameOver">
                Game Over
            </div>

            <div class="ground-lines"></div>

            <div class="ground"></div>

        </div>

        <div class="controls">
            Press SPACE to jump
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
